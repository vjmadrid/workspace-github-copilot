<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Hola mundo</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f6f7fb;
        color: #172033;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
      }

      main {
        width: min(92vw, 560px);
        padding: 40px;
        border: 1px solid #d8deea;
        border-radius: 8px;
        background: #ffffff;
        box-shadow: 0 20px 60px rgb(23 32 51 / 10%);
        text-align: center;
      }

      h1 {
        margin: 0;
        font-size: clamp(2.25rem, 8vw, 4.5rem);
        line-height: 1;
        letter-spacing: 0;
      }

      p {
        margin: 18px 0 0;
        color: #526070;
        font-size: 1.05rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Hola mundo</h1>
      <p>Frontend arrancado con Express.</p>
    </main>
  </body>
</html>
